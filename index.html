<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>东方明珠塔</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1.25rem 3rem;
      font-family: sans-serif;
      line-height: 1.55;
      color: #1c1c1c;
      background: #f4f1ec;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.8rem;
    }
    p {
      margin: 0 0 1.25rem;
    }
    video,
    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 1rem;
      background: #111;
    }
    h2 {
      margin: 1.5rem 0 0.75rem;
      font-size: 1.2rem;
    }
    figcaption {
      margin: -0.6rem 0 1rem;
      color: #444;
    }
  </style>
</head>
<body>
  <main>
    <h1>上海东方明珠广播电视塔</h1>
    <p>
      这座塔由 Blender bpy 脚本程序化建成，没有使用外部模型、素材或贴图。
      下面的视频是 Eevee 渲染的一圈环绕：1920×1080，24 fps，共 240 帧，约 10 秒。
    </p>
    <video controls src="oriental_pearl.mp4" width="1920" height="1080">
      环绕展示视频
    </video>
    <h2>静帧</h2>
    <figure>
      <img src="frame_0001.png" width="1920" height="1080" alt="第 1 帧，环绕起点">
      <figcaption>第 1 帧</figcaption>
    </figure>
    <figure>
      <img src="frame_0120.png" width="1920" height="1080" alt="第 120 帧，大约转到对面">
      <figcaption>第 120 帧</figcaption>
    </figure>
    <figure>
      <img src="frame_0240.png" width="1920" height="1080" alt="第 240 帧，转满一圈">
      <figcaption>第 240 帧</figcaption>
    </figure>
  </main>
</body>
</html>
